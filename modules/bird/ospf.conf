protocol ospf v2 kitauji_v4 {
    ipv4 {
        import filter OSPF_V4_IN;
        export filter OSPF_V4_OUT;
    };
    include "ospf_backbone.conf";
};

protocol ospf v3 kitauji_v6 {
    ipv6 {
        import filter OSPF_V6_IN;
        export filter OSPF_V6_OUT;
    };
    include "ospf_backbone.conf";
};
