include "bfd-secret.conf";

include "variables.conf";

router id OWNIP;

log syslog all;

# ROA tables are declared for the DN42 filters but not populated; no
# DN42 eBGP peers are configured on this node.
roa4 table dn42_roa;
roa6 table dn42_roa_v6;

timeformat base iso long;
timeformat log iso long;
timeformat protocol iso long;
timeformat route iso long;

include "filters.conf";

protocol device {
    scan time 10;
}

protocol kernel kernel_v4 {
    scan time 20;

    ipv4 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            krt_prefsrc = OWNIP;
            accept;
        };
    };
}

# kernel_v6 stays disabled, as on the Ubuntu install (kernel issues).

protocol static agg_v4 {
    route OWNNET reject;

    ipv4 {
        import all;
        export none;
    };
}

protocol static agg_v6 {
    route OWNNETv6 reject;

    ipv6 {
        import all;
        export none;
    };
}

template bgp rr_client {
    local as OWNAS;
    source address OWNIP;
    bfd;

    ipv4 {
        import filter IBGP_V4_IN;
        export filter IBGP_V4_OUT;
        next hop self;
    };

    ipv6 {
        import filter IBGP_V6_IN;
        export filter IBGP_V6_OUT;
        next hop self;
    };
}

protocol bfd kitauji_bfd {
    interface "ibgp_*" {
        min tx interval 100 ms;
        min rx interval 100 ms;
        idle tx interval 300 ms;
        multiplier 10;
        password BFD_IFACE_PASSWORD;
    };

    multihop {
        min tx interval 100 ms;
        min rx interval 100 ms;
        idle tx interval 300 ms;
        multiplier 10;
        password BFD_MULTIHOP_PASSWORD;
    };

    neighbor 172.22.179.97 local OWNIP multihop;
    neighbor 172.22.179.98 local OWNIP multihop;
}

include "ospf.conf";
include "rr/*";
