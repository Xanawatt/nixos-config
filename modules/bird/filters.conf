function is_self_net() {
    if net.type = NET_IP4 && net ~ OWNNETSET then {
        return true;
    } else if net.type = NET_IP6 && net ~ OWNNETSETv6 then {
        return true;
    }
    return false;
}

function is_dn42_network() {
    if net.type = NET_IP4 then {
        return net ~ [
            172.20.0.0/14{21,29}, # dn42
            172.20.0.0/24{28,32}, # dn42 Anycast
            172.21.0.0/24{28,32}, # dn42 Anycast
            172.22.0.0/24{28,32}, # dn42 Anycast
            172.23.0.0/24{28,32}, # dn42 Anycast
            172.31.0.0/16+,       # ChaosVPN
            10.100.0.0/14+,       # ChaosVPN
            10.127.0.0/16{16,32}, # neonetwork
            10.0.0.0/8{15,24}     # Freifunk.net
        ];
    } else if net.type = NET_IP6 then {
        return net ~ [
            fd00::/8{44,64}  # ULA address space as per RFC 4193
        ];
    } else {
        return false;
    }
}

function is_ptp() {
    return net ~ [192.168.255.0/24{31,31}];
}

filter DN42_V4_OUT {
    if is_dn42_network() && source ~ [RTS_STATIC, RTS_BGP] then {
        accept;
    } else reject;
};

filter DN42_V6_OUT {
    if is_dn42_network() && source ~ [RTS_STATIC, RTS_BGP] then {
        accept;
    } else reject;
};

filter DN42_V4_IN {
    if is_dn42_network() && !is_self_net() then {
        if (roa_check(dn42_roa, net, bgp_path.last) != ROA_VALID) then {
            print "[DN42] ROA check failed for ", net, " ASN ", bgp_path.last;
            reject;
        # special check for overlapping route from icvpn
        } else if net ~ 172.31.0.0/16 then {
            reject;
        } else accept;
    } else reject;
};

filter DN42_V6_IN {
    if is_dn42_network() && !is_self_net() then {
        if (roa_check(dn42_roa_v6, net, bgp_path.last) != ROA_VALID) then {
            print "[DN42] ROA check failed for ", net, " ASN ", bgp_path.last;
            reject;
        } else accept;
    } else reject;
};

filter OSPF_V4_IN {
    if source = RTS_BGP || is_ptp() then {
        reject;
    }
    accept;
};

filter OSPF_V4_OUT {
    if source = RTS_BGP || is_ptp() then {
        reject;
    }
    accept;
};

filter OSPF_V6_IN {
    if source != RTS_BGP then {
        accept;
    } else {
        reject;
    }
};

filter OSPF_V6_OUT {
    if source != RTS_BGP then {
        accept;
    } else {
        reject;
    }
};

filter IBGP_V4_IN {
    if source = RTS_BGP && is_dn42_network() && !is_self_net() then {
        accept;
    } else {
        reject;
    }
};

filter IBGP_V4_OUT {
    if source = RTS_BGP && is_dn42_network() && !is_self_net() then {
        accept;
    } else {
        reject;
    }
};

filter IBGP_V6_IN {
    if source = RTS_BGP && is_dn42_network() && !is_self_net() then {
        accept;
    } else {
        reject;
    }
};

filter IBGP_V6_OUT {
    if source = RTS_BGP && is_dn42_network() && !is_self_net() then {
        accept;
    } else {
        reject;
    }
};
